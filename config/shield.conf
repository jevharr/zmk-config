CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERAL=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_PERIPHERAL=y
CONFIG_ZMK_BLE_CENTRAL=y
CONFIG_ZMK_BLE_DEVICE_NAME="Chocofi36"
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
# Increase Bluetooth transmission power for better stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep to save battery (default is 15 mins)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Fix for Windows battery reporting issues
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Mouse support (if you plan to use mouse keys in your keymap)
CONFIG_ZMK_MOUSE=y

# Debounce settings to prevent double-strikes on Choc switches
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

